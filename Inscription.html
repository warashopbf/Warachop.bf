<!DOCTYPE html>
<html>
<head>
  <title>Inscription - Wara Chop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background-color:#1a1a1a;
      font-family:Arial;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }
    .logo { color:#ff6600; font-size:35px; font-weight:bold; margin-bottom:10px; }
    .slogan { color:#cccccc; font-size:14px; margin-bottom:30px; }
    .carte {
      background:white;
      border-radius:20px;
      padding:30px 25px;
      width:100%;
      max-width:400px;
    }
    .carte h2 { text-align:center; margin-bottom:25px; color:#1a1a1a; }
    .champ { margin-bottom:15px; }
    .champ label { display:block; color:#666; font-size:14px; margin-bottom:8px; }
    .champ input, .champ select {
      width:100%;
      padding:12px 15px;
      border:2px solid #eee;
      border-radius:10px;
      font-size:16px;
      outline:none;
    }
    .champ input:focus, .champ select:focus { border-color:#ff6600; }
    .btn-inscrire {
      width:100%;
      padding:15px;
      background:#ff6600;
      color:white;
      border:none;
      border-radius:10px;
      font-size:18px;
      font-weight:bold;
      margin-top:10px;
    }
    .connexion {
      text-align:center;
      margin-top:20px;
      color:#666;
      font-size:14px;
    }
    .connexion a {
      color:#ff6600;
      font-weight:bold;
      text-decoration:none;
    }
  </style>
</head>
<body>

  <div class="logo">Wara Chop 🛒</div>
  <div class="slogan">Rejoins la communauté Wara Chop !</div>

  <div class="carte">
    <h2>Inscription</h2>

    <div class="champ">
      <label>👤 Nom complet</label>
      <input type="text" id="nom" placeholder="Ex: Moussa Ouédraogo"/>
    </div>

    <div class="champ">
      <label>📱 Numéro de téléphone</label>
      <input type="tel" id="tel" placeholder="Ex: 70 00 00 00"/>
    </div>

    <div class="champ">
      <label>📧 Email (optionnel)</label>
      <input type="email" id="email" placeholder="Ex: moussa@gmail.com"/>
    </div>

    <div class="champ">
      <label>🔒 Mot de passe</label>
      <input type="password" id="mdp" placeholder="Minimum 6 caractères"/>
    </div>

    <div class="champ">
      <label>🎯 Tu veux être ?</label>
      <select id="role">
        <option value="">-- Choisis ton rôle --</option>
        <option value="acheteur">👤 Acheteur</option>
        <option value="vendeur">🏪 Vendeur</option>
        <option value="livreur">🛵 Livreur</option>
      </select>
    </div>

    <button class="btn-inscrire" onclick="sInscrire()">
      Créer mon compte
    </button>

    <div class="connexion">
      Déjà un compte ?
      <a href="connexion.html">Se connecter</a>
    </div>

  </div>

  <script>
    function sInscrire() {
      let nom = document.getElementById("nom").value;
      let tel = document.getElementById("tel").value;
      let mdp = document.getElementById("mdp").value;
      let role = document.getElementById("role").value;

      if (nom == "" || tel == "" || mdp == "" || role == "") {
        alert("⚠️ Remplis tous les champs obligatoires !");
      } else if (mdp.length < 6) {
        alert("⚠️ Mot de passe trop court ! Minimum 6 caractères.");
      } else {
        alert("✅ Compte créé ! Bienvenue " + nom + " sur Wara Chop !");
      }
    }
  </script>

</body>
</html>
