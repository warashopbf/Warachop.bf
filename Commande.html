<!DOCTYPE html>
<html>
<head>
  <title>Commande - Wara Chop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background-color:#f5f5f5; font-family:Arial; }
    header {
      background-color:#ff6600;
      padding:15px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    header h1 { color:white; font-size:20px; }
    .btn-retour {
      background:white;
      color:#ff6600;
      border:none;
      padding:8px 15px;
      border-radius:20px;
      font-weight:bold;
    }
    .resume {
      background:white;
      padding:20px;
      margin:10px;
      border-radius:15px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }
    .resume h3 {
      font-size:18px;
      margin-bottom:15px;
      color:#1a1a1a;
    }
    .resume-item {
      display:flex;
      justify-content:space-between;
      padding:8px 0;
      border-bottom:1px solid #eee;
      font-size:15px;
    }
    .resume-item:last-child { border-bottom:none; }
    .resume-total {
      display:flex;
      justify-content:space-between;
      padding:12px 0;
      font-size:18px;
      font-weight:bold;
      color:#ff6600;
    }
    .section {
      background:white;
      padding:20px;
      margin:10px;
      border-radius:15px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }
    .section h3 {
      font-size:18px;
      margin-bottom:15px;
      color:#1a1a1a;
    }
    .champ { margin-bottom:15px; }
    .champ label {
      display:block;
      color:#666;
      font-size:14px;
      margin-bottom:8px;
    }
    .champ input, .champ select, .champ textarea {
      width:100%;
      padding:12px 15px;
      border:2px solid #eee;
      border-radius:10px;
      font-size:15px;
      outline:none;
    }
    .champ input:focus,
    .champ select:focus,
    .champ textarea:focus { border-color:#ff6600; }
    .champ textarea { height:80px; resize:none; }
    .paiement-options {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    .paiement-btn {
      border:2px solid #eee;
      border-radius:15px;
      padding:15px;
      text-align:center;
      background:white;
      cursor:pointer;
    }
    .paiement-btn.actif {
      border-color:#ff6600;
      background:#fff5ee;
    }
    .paiement-btn span { font-size:30px; }
    .paiement-btn p {
      font-size:13px;
      font-weight:bold;
      margin-top:5px;
      color:#1a1a1a;
    }
    .btn-confirmer {
      width:calc(100% - 20px);
      margin:10px;
      padding:18px;
      background:#ff6600;
      color:white;
      border:none;
      border-radius:15px;
      font-size:20px;
      font-weight:bold;
    }
    .espace-bas { height:20px; }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Ma Commande</h1>
    <a href="produit.html">
      <button class="btn-retour">← Retour</button>
    </a>
  </header>

  <!-- RESUME COMMANDE -->
  <div class="resume">
    <h3>📦 Résumé</h3>
    <div class="resume-item">
      <span>🍜 Nouilles instantanées</span>
      <span>200 FCFA</span>
    </div>
    <div class="resume-item">
      <span>🛵 Frais de livraison</span>
      <span>500 FCFA</span>
    </div>
    <div class="resume-total">
      <span>Total</span>
      <span>700 FCFA</span>
    </div>
  </div>

  <!-- ADRESSE -->
  <div class="section">
    <h3>📍 Adresse de livraison</h3>

    <div class="champ">
      <label>👤 Nom complet</label>
      <input type="text" id="nom" placeholder="Ex: Moussa Ouédraogo"/>
    </div>

    <div class="champ">
      <label>📱 Numéro de téléphone</label>
      <input type="tel" id="tel" placeholder="Ex: 70 00 00 00"/>
    </div>

    <div class="champ">
      <label>🏙️ Quartier</label>
      <select id="quartier">
        <option value="">-- Choisir ton quartier --</option>
        <option>Gounghin</option>
        <option>Pissy</option>
        <option>Tampouy</option>
        <option>Zogona</option>
        <option>Ouaga 2000</option>
        <option>Karpala</option>
        <option>Autre</option>
      </select>
    </div>

    <div class="champ">
      <label>📝 Précision sur l'adresse</label>
      <textarea id="adresse" placeholder="Ex: Près de la mosquée, maison bleue..."></textarea>
    </div>
  </div>

  <!-- PAIEMENT -->
  <div class="section">
    <h3>💳 Mode de paiement</h3>
    <div class="paiement-options">
      <div class="paiement-btn" onclick="choisirPaiement(this)">
        <span>🟠</span>
        <p>Orange Money</p>
      </div>
      <div class="paiement-btn" onclick="choisirPaiement(this)">
        <span>🔵</span>
        <p>Moov Money</p>
      </div>
      <div class="paiement-btn" onclick="choisirPaiement(this)">
        <span>💵</span>
        <p>Cash à la livraison</p>
      </div>
      <div class="paiement-btn" onclick="choisirPaiement(this)">
        <span>💳</span>
        <p>Coris Bank</p>
      </div>
    </div>
  </div>

  <!-- BOUTON CONFIRMER -->
  <button class="btn-confirmer" onclick="confirmerCommande()">
    ✅ Confirmer la commande
  </button>

  <div class="espace-bas"></div>

  <script>
    let paiementChoisi = "";

    function choisirPaiement(btn) {
      document.querySelectorAll(".paiement-btn").forEach(function(b) {
        b.classList.remove("actif");
      });
      btn.classList.add("actif");
      paiementChoisi = btn.querySelector("p").innerText;
    }

    function confirmerCommande() {
      let nom = document.getElementById("nom").value;
      let tel = document.getElementById("tel").value;
      let quartier = document.getElementById("quartier").value;

      if (nom == "" || tel == "" || quartier == "") {
        alert("⚠️ Remplis tous les champs !");
        return;
      }

      if (paiementChoisi == "") {
        alert("⚠️ Choisis un mode de paiement !");
        return;
      }

      alert(
        "🎉 Commande confirmée !\n\n" +
        "👤 Nom : " + nom + "\n" +
        "📱 Téléphone : " + tel + "\n" +
        "📍 Quartier : " + quartier + "\n" +
        "💳 Paiement : " + paiementChoisi + "\n\n" +
        "🛵 Un livreur arrive bientôt !"
      );
    }
  </script>

</body>
</html>
